[browser]
# CyberSentry sends nothing anywhere, so Streamlit's anonymous usage statistics are switched off too.
gatherUsageStats = false

[theme]
base              = "dark"
primaryColor      = "#3b82f6"          # blue accent — used for buttons and focus rings
backgroundColor   = "#0f1117"          # near-black page background
secondaryBackgroundColor = "#1c2130"   # slightly lighter surface (sidebar, cards)
textColor         = "#e2e8f0"          # off-white body text
font              = "sans serif"
