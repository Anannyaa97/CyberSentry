[browser]
# CyberSentry sends nothing anywhere, so Streamlit's anonymous usage statistics are switched off too.
gatherUsageStats = false

[theme]
base                     = "dark"
primaryColor             = "#00d4ff"          # cyan/teal accent — buttons, focus rings, highlights
backgroundColor          = "#060d1a"          # deep navy page background
secondaryBackgroundColor = "#0d1b2e"          # card / sidebar surface
textColor                = "#c8d8e8"          # cool off-white body text
font                     = "sans serif"
